<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css" />
    <title>AI Recipe Generator</title>
  </head>
  <body>
    <header>
      <h1>Recipe Generator</h1>
    </header>

    <main>
      <form>
        <label for="servings">Number of servings</label>
        <input type="number" id="servings" min="1" max="10" /> <br />
        <input
          type="text"
          placeholder="Enter the ingredients you would like to use"
          required
        />
        <input type="submit" value="Submit" />
      </form>
      <div>The recipe will go here</div>
    </main>
    <footer>
      This AI project was coded by
      <a href="https://github.com/maellynkutila-afk" target="_blank"
        >Maelly Barbier</a
      >
      and is
      <a
        href="https://github.com/maellynkutila-afk/Recipe-generator"
        target="_blank"
        >open-sourced on Github</a
      >
      and is
      <a href="https://recipe-generator-5wm1.onrender.com" target="_blank"
        >hosted on Render</a
      >
    </footer>

    <script src="src/script.js"></script>
  </body>
</html>
